<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>
	<style>
	body{
		font-family:sans-serif;
		background-color:#f0f4f8;
		padding:40px;
		margin:0;
		}
	h1{
		color:#1a202c;
		font-size:1.6rem;
		margin-bottom:24px;
		}
		
		
	</style>
</head>
<body>
	<h1>Student Registration Form</h1>
	<form>
		<label>Full Name</label><br>
		<input type="text" placeholder="Enter your full name"></input><br><br>
		
		<label>Email</label><br>
		<input type="email "placeholder="you@gmail.com"></input><br><br>
		
		<label>Password</label><br>
		<input type="password"placeholder="xxxx"></input><br><br>
		
		<label>Age</label><br>
		<input type="number"placeholder="Add your Age"></input><br><br>
		
		<label>Phone Number</label><br>
		<input type="tel"placeholder="Enter your telephone number"></input><br><br>
		
	<p>Gender</p>
		<label><input type="radio"name="gender"></input>Female</label><br>
		<label><input type="radio"name="gender"></input>Male</label><br>
		<label><input type="radio"name="gender"></input>Prefer not to say</label><br><br>		
	
	<p>Skills</p>
		<label><input type="checkbox"name="skills"></input>HTML<br>
			   <input type="checkbox"name="skills"></input>SQL<br>
			   <input type="checkbox"name="skills"></input>C++<br>
		</label><br><br>
		
	<label>Year Of Study</label><br>
	<select name="year">
		<option>Select Year</option>
		<option>First Year</option>
		<option>Second Year</option>
		<option>Third Year</option>
	</select><br><br>
	<label>About You</label><br>
	<textarea rows ="4"></textarea>
	<br><br>
	
	<button type="submit">Submit</button>
	
	
		
	</form>
</body>
</html>
